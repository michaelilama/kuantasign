# Compila los instaladores de KuantaSign y los publica en la versión (release) de GitHub.
# Nombres fijos (KuantaSign-Windows.exe, KuantaSign-Mac.dmg) para que K360 descargue siempre
# la última con …/releases/latest/download/<nombre>.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          - so: windows-latest
            args: --bundles nsis
            origen: app/src-tauri/target/release/bundle/nsis/*.exe
            nombre: KuantaSign-Windows.exe
          - so: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            origen: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            nombre: KuantaSign-Mac.dmg
    runs-on: ${{ matrix.so }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.so == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app/src-tauri }
      - name: Compilar
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}
      - name: Publicar en la versión
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          TAG="${GITHUB_REF_NAME}"
          [[ "$TAG" == v* ]] || TAG="v$VERSION"
          cp ${{ matrix.origen }} "${{ matrix.nombre }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "KuantaSign $VERSION" --notes "Instaladores de KuantaSign $VERSION" || true
          gh release upload "$TAG" "${{ matrix.nombre }}" --clobber
